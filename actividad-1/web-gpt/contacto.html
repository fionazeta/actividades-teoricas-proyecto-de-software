<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Reseñas de Juegos de Mesa</title>
    <link rel="stylesheet" href="estilosIA.css">
</head>
<body>
    <header>
        <div class="logo">Mesa & Tablero</div>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="catalogo.html">Catálogo</a></li>
                <li><a href="contacto.html" class="activo">Contacto</a></li>
                <li><a href="mantenimiento.html">Mantenimiento</a></li>
            </ul>
        </nav>
    </header>

    <main class="contenedor">
        <h1>Ponte en Contacto</h1>
        <p>¿Tienes alguna recomendación o sugerencia? Escríbenos.</p>
        
        <form action="#" method="POST" class="formulario">
            <div class="campo">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre">
            </div>
            
            <div class="campo">
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" name="email" required placeholder="tu@email.com">
            </div>
            
            <div class="campo">
                <label for="mensaje">Mensaje:</label>
                <textarea id="mensaje" name="mensaje" rows="4" required placeholder="¿Qué nos quieres contar?"></textarea>
            </div>
            
            <button type="submit" class="btn-enviar">Enviar</button>
        </form>
    </main>
</body>
</html>
