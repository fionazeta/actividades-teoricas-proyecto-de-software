<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reseñas de Juegos de Mesa - Contacto</title>
  <link rel="stylesheet" href="estilosIA.css">
</head>
<body>
  <a href="#contenido-principal" class="saltar-enlace">Saltar al contenido principal</a>

  <header class="encabezado">
    <h1>Reseñas de Juegos de Mesa</h1>
    <nav class="nav-principal" aria-label="Navegación principal">
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="contacto.html" aria-current="page">Contacto</a></li>
        <li><a href="mantenimiento.html">Mantenimiento</a></li>
        <li><a href="catalogo.html">Catálogo</a></li>
      </ul>
    </nav>
  </header>

  <main id="contenido-principal">
    <h2>Contacto</h2>
    <p>¿Tenés dudas, sugerencias o querés proponer un juego para reseñar? Escribinos.</p>

    <form class="formulario-contacto" action="#" method="post">
      <div class="campo-formulario">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" required autocomplete="name">
      </div>

      <div class="campo-formulario">
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" name="correo" required autocomplete="email">
      </div>

      <div class="campo-formulario">
        <label for="mensaje">Mensaje</label>
        <textarea id="mensaje" name="mensaje" rows="5" required></textarea>
      </div>

      <button type="submit" class="boton-enviar">Enviar</button>
    </form>
  </main>

  <footer class="pie-pagina">
    <p>&copy; 2026 Reseñas de Juegos de Mesa</p>
  </footer>
</body>
</html>
